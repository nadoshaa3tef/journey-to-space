<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Journey To Space</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/pages/register.css" />
  </head>
  <body>
    <nav class="navigation">
      <a href="../index.html" class="back-home-btn">
        <i class="fa fa-arrow-left"></i> Back to Mission Control
      </a>
    </nav>

    <div class="register-container">
      <div class="register-card" id="registerCard">
        <div class="rocket-icon" id="rocketIcon">
          <i class="fas fa-rocket"></i>
        </div>
        <h1>JOIN THE MISSION</h1>
        <p>Create your astronaut profile to explore the universe.</p>

        <form id="registerForm">
          <div class="input-group">
            <label for="username">Astronaut Name</label>
            <input
              type="text"
              id="username"
              placeholder="Enter your name"
              required
            />
            <div class="validation-msg"></div>
          </div>

          <div class="input-group">
            <label for="email">Interstellar Email</label>
            <input
              type="email"
              id="email"
              placeholder="email@space.com"
              required
            />
            <div class="validation-msg"></div>
          </div>

          <div class="input-group">
            <label for="password">Security Code (Password)</label>
            <input
              type="password"
              id="password"
              placeholder="At least 6 characters"
              required
            />
            <div class="strength-meter">
              <div class="strength-bar" id="strengthBar"></div>
            </div>
            <div class="validation-msg"></div>
          </div>

          <div class="input-group">
            <label for="confirmPassword">Confirm Security Code</label>
            <input
              type="password"
              id="confirmPassword"
              placeholder="Repeat your password"
              required
            />
            <div class="validation-msg"></div>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">
            Launch Profile <i class="fas fa-paper-plane"></i>
          </button>
        </form>
      </div>

      <div class="success-overlay" id="successOverlay">
        <div class="launch-sequence">
          <div class="rocket-launch" id="rocketLaunch">
            <i class="fas fa-rocket"></i>
            <div class="fire"></div>
          </div>
          <h2>IGNITION... LIFT OFF!</h2>
          <p>Welcome aboard, Astronaut <span id="displayUserName"></span>!</p>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="../js/register.js"></script>
  </body>
</html>
